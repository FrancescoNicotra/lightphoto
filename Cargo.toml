[workspace]
resolver = "2"
members = ["crates/xmp", "crates/lut", "crates/raw", "crates/pipeline", "crates/export", "crates/align", "crates/merge", "tools/xmp-dump", "tools/lumen-cli", "tools/compare", "tools/calibrate", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
xmp = { path = "crates/xmp" }
lut = { path = "crates/lut" }
raw = { path = "crates/raw" }
pipeline = { path = "crates/pipeline" }
export = { path = "crates/export" }
align = { path = "crates/align" }
merge = { path = "crates/merge" }
roxmltree = "0.20"
flate2 = "1"
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Decoding and demosaicing are unusable without optimisations.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.raw]
opt-level = 3

[profile.dev.package.pipeline]
opt-level = 3

[profile.dev.package.align]
opt-level = 3

[profile.dev.package.merge]
opt-level = 3
