# Lightroom references for the calibration bench (tools/calibrate).
# How to make the missing exports: docs/calibration.md.
#
# Paths are relative to the samples root (samples/, or $LUMEN_SAMPLES).
# Every entry starts from Camera Raw's defaults for its kind of source
# (no sharpening or colour noise reduction on a JPEG), then applies the
# preset, then `settings` (crs: keys without the prefix).
# Entries whose files are missing are skipped with a warning.

size = 480         # long edge of the comparison, pixels
max_delta_e = 3.0  # default threshold on the mean ΔE2000; provisional for
                   # the entries not measured yet: tighten once measured

[[reference]]
name = "dreamy"
source = "pixls/P1010041-camera.jpg"
kind = "jpeg"
preset = "Dreamy days in spring.xmp"
reference = "pixls/P1010041-camera-lightroom-dreamy.jpg"
max_delta_e = 3.0
note = "Lightroom 12 for iOS, the whole preset (grain included), sRGB JPEG at full size"

# --- One slider at a time, on the camera JPEG of the GX80. ---------------
# Lightroom for iOS (free), grain 0, exported as described in
# docs/calibration.md into samples/pixls/lightroom/.

[[reference]]
name = "original"
source = "pixls/P1010041-camera.jpg"
kind = "jpeg"
reference = "pixls/lightroom/P1010041-original.jpg"
max_delta_e = 1.0
note = "no edits: measures Lightroom's own JPEG round trip, the floor of every other entry"

